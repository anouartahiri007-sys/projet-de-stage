services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
    environment:
      - APP_ENV=local
      - APP_KEY=base64:YOUR_KEY_HERE
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_DATABASE=hris_platform
      - DB_USERNAME=root
      - DB_PASSWORD=root
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: hris_platform
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
